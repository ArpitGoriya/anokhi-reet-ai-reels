<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#FFF2DF;font-family:Inter,sans-serif}
*{box-sizing:border-box}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#F6E7CF}
#svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
#ui{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.sui{position:absolute;left:0;top:0;width:1080px;height:1920px}
.pill{position:absolute;transform:translate(-50%,-50%);background:#fff;border:4px solid #3B2418;border-radius:999px;padding:12px 30px;font-weight:700;font-size:44px;line-height:1.1;color:#1A1A1A;white-space:nowrap;box-shadow:0 6px 0 rgba(59,36,24,.16)}
.pill .hl{background:#F8D36A;border-radius:12px;padding:0 10px;margin:0 -2px}
.pill.gold{background:#F8D36A}
.pill.maroon{background:#890304;color:#FFF2DF;border-color:#2b0001}
.pill.green{background:#E3F3EA;color:#1F7A4D;border-color:#1F7A4D}
.pill.big{font-size:56px;padding:16px 38px}
.step{display:inline-block;background:#890304;color:#FFF2DF;font-size:30px;font-weight:800;padding:6px 14px;border-radius:12px;margin-right:16px;vertical-align:5px}
.title{position:absolute;left:50%;transform:translate(-50%,-50%);width:1000px;text-align:center;font-weight:900;font-size:82px;line-height:1.08;color:#fff;-webkit-text-stroke:18px #2b0001;paint-order:stroke fill;letter-spacing:0}
.title .g{color:#F8D36A}
.bubble{position:absolute;transform:translate(-50%,-50%);background:#fff;border:5px solid #3B2418;border-radius:40px;padding:22px 34px;font-weight:700;font-size:44px;line-height:1.18;color:#1A1A1A;text-align:center;box-shadow:0 8px 0 rgba(59,36,24,.14)}
.bubble .hl{color:#890304}
.chalk{position:absolute;left:150px;font-weight:800;font-size:72px;color:#F4EFE3;white-space:nowrap;font-family:Inter}
.chalk.g{color:#F8D36A;font-size:84px}
#cap{position:absolute;left:50px;width:980px;text-align:center;font-weight:900;font-size:64px;line-height:1.14;color:#fff;-webkit-text-stroke:15px #2b0001;paint-order:stroke fill}
#cap .w{display:inline-block;margin:0 1px}
#cap .w.dim{color:#D9C6B0}
#cap .w.g{color:#F8D36A}
#cap .w.g.dim{color:#C9AE6A}
#wm{position:absolute;right:30px;top:196px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.88);border-radius:999px;padding:6px 18px 6px 6px;font-weight:700;font-size:26px;color:#890304;border:3px solid rgba(59,36,24,.25)}
#wm img{width:44px;height:44px;border-radius:50%}
.follow{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:20px;background:#fff;border:5px solid #3B2418;border-radius:999px;padding:14px 16px 14px 14px;box-shadow:0 10px 0 rgba(59,36,24,.16)}
.follow img.seal{width:96px;height:96px;border-radius:50%}
.follow .nm{font-weight:800;font-size:46px;color:#890304;white-space:nowrap}
.follow .btn{background:#890304;color:#FFF2DF;font-weight:800;font-size:40px;border-radius:999px;padding:16px 34px;white-space:nowrap}

</style>
<div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"><defs>
<radialGradient id="glow"><stop offset="0" stop-color="#F8D36A" stop-opacity=".55"/><stop offset="1" stop-color="#F8D36A" stop-opacity="0"/></radialGradient>
<linearGradient id="mar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A0000"/><stop offset="1" stop-color="#5D0000"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A16F35"/><stop offset=".18" stop-color="#F8D36A"/><stop offset=".72" stop-color="#F8D36A"/><stop offset="1" stop-color="#9A6A36"/></linearGradient>
</defs><g id="scenes"></g></svg>
<div id="ui"><div id="cap"></div><div id="wm"><img src="brand:seal-on-maroon">Anokhi Reet</div></div></div>
<script src="inbox:hetal-cover.js"></script>
