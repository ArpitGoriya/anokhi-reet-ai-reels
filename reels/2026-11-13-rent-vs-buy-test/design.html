<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: Inter; background: #FFF2DF; }
  .scene { position: absolute; inset: 0; opacity: 0; }

  /* Scene 1: hook, real bridal lehengas on maroon (0 - 3.9 s) */
  #s1 { background: linear-gradient(135deg, #9A0000 0%, #5D0000 100%); opacity: 1;
        animation: out 0.35s ease 3.75s forwards; }
  @keyframes out { to { opacity: 0; } }
  .hook { position: absolute; top: 290px; left: 90px; right: 90px; text-align: center;
          color: #FFF2DF; font-weight: 700; font-size: 74px; line-height: 1.1;
          opacity: 0; animation: rise 0.5s cubic-bezier(.2,.7,.2,1) 0.1s forwards; }
  .hook span { color: #F8D36A; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .card { position: absolute; top: 500px; left: 210px; width: 660px; height: 990px; overflow: hidden;
          border-radius: 28px; border: 3px solid rgba(248, 211, 106, .55); opacity: 0; }
  .card img { position: absolute; top: 0; width: 943px; left: -141px; }
  .c1 { animation: cardin .45s cubic-bezier(.2,.7,.2,1) 0.15s forwards, cardout .3s ease 1.35s forwards; }
  .c2 { animation: cardin .45s cubic-bezier(.2,.7,.2,1) 1.35s forwards, cardout .3s ease 2.6s forwards; }
  .c3 { animation: cardin .45s cubic-bezier(.2,.7,.2,1) 2.6s forwards; }
  @keyframes cardin { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: scale(1); } }
  @keyframes cardout { from { opacity: 1; } to { opacity: 0; transform: scale(.97); } }

  /* Scenes 2-3: the real calculator on a phone (3.9 - 12.6 s) */
  #s2 { animation: fadein .35s ease 3.75s forwards, out .35s ease 12.45s forwards; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .label { position: absolute; top: 280px; left: 0; right: 0; text-align: center; font-weight: 700;
           font-size: 64px; color: #141110; opacity: 0; }
  .label b { color: #890304; }
  .l1 { animation: rise .45s cubic-bezier(.2,.7,.2,1) 4.1s forwards, cardout .3s ease 9.3s forwards; }
  .l2 { animation: rise .45s cubic-bezier(.2,.7,.2,1) 9.6s forwards; }
  .phone { position: absolute; top: 400px; left: 270px; width: 540px; height: 1148px; box-shadow: 0 20px 60px rgba(74,0,2,0.18); border-radius: 56px;
           border: 10px solid #141110; overflow: hidden; background: #fff;
           transform-origin: 50% 0%;
           animation: phonein .6s cubic-bezier(.2,.7,.2,1) 3.9s both, zoom 1.1s cubic-bezier(.4,0,.2,1) 9.8s forwards; }
  .phone img { width: 100%; display: block; }
  @keyframes phonein { from { transform: translateY(80px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.1); } }

  /* Scene 4: end card (12.6 - 16.2 s) */
  #s4 { background: #FFF2DF; animation: fadein .4s ease 12.6s forwards; }
  .tools { position: absolute; top: 600px; left: 200px; width: 680px; opacity: 0;
           animation: rise .5s cubic-bezier(.2,.7,.2,1) 12.8s forwards; }
  .mandala { position: absolute; left: 90px; top: 520px; width: 900px; opacity: 0; animation: faint 1s ease 12.8s forwards; }
  @keyframes faint { to { opacity: .1; } }
  .tools img { width: 100%; display: block; }
  .free { position: absolute; top: 1010px; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 96px;
          color: #141110; opacity: 0; animation: rise .5s cubic-bezier(.2,.7,.2,1) 13.1s forwards; }
  .pill { position: absolute; top: 1190px; left: 50%; transform: translateX(-50%); padding: 26px 56px; border-radius: 999px;
          background: linear-gradient(91.5deg, #9A0000 0%, #5D0000 100%); color: #FFF2DF; font-weight: 600;
          font-size: 48px; white-space: nowrap; opacity: 0; animation: fadein .5s ease 13.5s forwards; }
</style>

<div class="scene" id="s1">
  <div class="hook">Ek din ke liye<br><span>pura kharcha?</span></div>
  <div class="card c1"><img src="capture:lehenga-pink"></div>
  <div class="card c2"><img src="capture:lehenga-yellow"></div>
  <div class="card c3"><img src="capture:lehenga-orange"></div>
</div>

<div class="scene" id="s2">
  <div class="label l1">Price <b>daalo</b></div>
  <div class="label l2">Dekho kitni <b>bachat</b></div>
  <div class="phone"><img src="clip:calc-slide" data-start="3.9"></div>
</div>

<div class="scene" id="s4">
  <img class="mandala" src="brand:mandala">
  <div class="tools"><img src="brand:lockup-tools-dark"></div>
  <div class="free">Try it free</div>
  <div class="pill">anokhireet.in</div>
</div>
